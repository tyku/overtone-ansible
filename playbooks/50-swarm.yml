---
- name: Initialize the single Swarm manager
  hosts: swarm_managers
  become: true
  gather_facts: false

  pre_tasks:
    - name: Require exactly one manager in inventory
      ansible.builtin.assert:
        that:
          - groups['swarm_managers'] | length == 1
          - private_ip is defined
          - "'CHANGE_ME' not in private_ip"
        fail_msg: Configure exactly one manager and its private_ip.

  tasks:
    - name: Initialize Swarm using the private network
      community.docker.docker_swarm:
        state: present
        advertise_addr: "{{ private_ip }}"
        data_path_addr: "{{ private_ip }}"

    - name: Read the worker join token in memory
      community.docker.docker_swarm_info:
      register: swarm_info
      no_log: true

    - name: Keep the worker token only as an in-memory host fact
      ansible.builtin.set_fact:
        swarm_worker_join_token: "{{ swarm_info.swarm_facts.JoinTokens.Worker }}"
      no_log: true

- name: Join workers to Swarm one at a time
  hosts: swarm_workers
  become: true
  gather_facts: false
  serial: 1

  pre_tasks:
    - name: Validate the worker private address
      ansible.builtin.assert:
        that:
          - private_ip is defined
          - "'CHANGE_ME' not in private_ip"
        fail_msg: Replace the worker private_ip placeholder.

  tasks:
    - name: Join the worker using private control and data paths
      community.docker.docker_swarm:
        state: join
        advertise_addr: "{{ private_ip }}"
        data_path_addr: "{{ private_ip }}"
        join_token: >-
          {{ hostvars[groups['swarm_managers'][0]].swarm_worker_join_token }}
        remote_addrs:
          - >-
            {{ hostvars[groups['swarm_managers'][0]].private_ip }}:2377
      no_log: true
