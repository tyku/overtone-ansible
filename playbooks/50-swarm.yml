---
- name: Initialize or validate the single Swarm manager
  hosts: swarm_managers
  become: true
  gather_facts: false

  roles:
    - role: swarm_cluster
      vars:
        swarm_cluster_operation: manager

- name: Join or validate Swarm workers one at a time
  hosts: swarm_workers
  become: true
  gather_facts: false
  serial: 1

  roles:
    - role: swarm_cluster
      vars:
        swarm_cluster_operation: worker

- name: Verify the complete Swarm from its manager
  hosts: swarm_managers
  become: true
  gather_facts: false

  roles:
    - role: swarm_cluster
      vars:
        swarm_cluster_operation: verify
