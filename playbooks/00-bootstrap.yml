---
- name: Bootstrap administrative access on internal servers
  hosts: bootstrap_targets
  become: true
  gather_facts: true
  serial: 1

  pre_tasks:
    - name: Validate supported operating system
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: >-
          These playbooks currently support Debian/Ubuntu only. Stop and adapt
          package names before continuing on another distribution.

    - name: Validate bootstrap connection placeholders
      ansible.builtin.assert:
        that:
          - "'CHANGE_ME' not in ansible_host"
          - "'CHANGE_ME' not in ansible_user"
        fail_msg: Replace the CHANGE_ME values in inventories/bootstrap/hosts.yml.

    - name: Install bootstrap prerequisites
      ansible.builtin.apt:
        name:
          - python3
          - sudo
        state: present
        update_cache: true
        cache_valid_time: 3600

  tasks:
    - name: Create the overtone administrator
      ansible.builtin.user:
        name: "{{ overtone_admin_user }}"
        shell: /bin/bash
        create_home: true
        groups:
          - sudo
        append: true
        password_lock: true
        state: present

    - name: Install the administrator public key
      ansible.posix.authorized_key:
        user: "{{ overtone_admin_user }}"
        key: "{{ lookup('ansible.builtin.file', overtone_admin_public_key_path) }}"
        state: present
        exclusive: false

    - name: Allow passwordless sudo for the administrator
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ overtone_admin_user }}"
        content: "{{ overtone_admin_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Explain what bootstrap deliberately leaves unchanged
      ansible.builtin.debug:
        msg: >-
          User and key are installed. Existing provider access, root login,
          password authentication, sshd configuration and firewall are unchanged.
