---
# Bastion intentionally excluded: its SSH access is managed manually.
- name: Harden SSH on internal servers one at a time
  hosts: internal
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: Require an explicit confirmation of the tested overtone login
      ansible.builtin.assert:
        that:
          - ssh_hardening_confirmed | default(false) | bool
        fail_msg: >-
          First verify a separate interactive login through bastion. Then rerun
          with -e ssh_hardening_confirmed=true and --limit for one server.

  tasks:
    - name: Install and validate the SSH hardening drop-in
      block:
        - name: Install the SSH hardening drop-in
          ansible.builtin.template:
            src: templates/00-overtone-hardening.conf.j2
            dest: /etc/ssh/sshd_config.d/00-overtone-hardening.conf
            owner: root
            group: root
            mode: "0644"
            backup: true
            validate: /usr/sbin/sshd -t -f %s
          register: ssh_hardening_result

        - name: Validate the complete SSH configuration
          ansible.builtin.command: /usr/sbin/sshd -t
          changed_when: false

        - name: Schedule SSH reload after successful validation
          ansible.builtin.debug:
            msg: SSH configuration is valid and will now be reloaded.
          changed_when: ssh_hardening_result.changed
          notify: Reload SSH

      rescue:
        - name: Restore the previous SSH hardening drop-in
          ansible.builtin.copy:
            src: "{{ ssh_hardening_result.backup_file }}"
            dest: /etc/ssh/sshd_config.d/00-overtone-hardening.conf
            owner: root
            group: root
            mode: "0644"
            remote_src: true
          when: ssh_hardening_result.backup_file is defined

        - name: Remove a newly created invalid SSH hardening drop-in
          ansible.builtin.file:
            path: /etc/ssh/sshd_config.d/00-overtone-hardening.conf
            state: absent
          when: ssh_hardening_result.backup_file is not defined

        - name: Verify that the restored configuration is valid
          ansible.builtin.command: /usr/sbin/sshd -t
          changed_when: false

        - name: Stop after restoring the SSH configuration
          ansible.builtin.fail:
            msg: >-
              The new SSH configuration was invalid. The previous state was
              restored and SSH was not reloaded.

  handlers:
    - name: Reload SSH without terminating the current session
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
      listen: Reload SSH
