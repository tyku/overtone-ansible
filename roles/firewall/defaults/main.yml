---
firewall_public_interface: "{{ public_interface }}"
firewall_private_interface: "{{ private_interface }}"
firewall_default_incoming: deny
firewall_default_outgoing: allow
firewall_enable: true

# A host-mode Swarm publication can bypass UFW's INPUT policy. Restrict these
# host-addressed private service ports before Docker's destination NAT.
firewall_docker_guard_port: >-
  {{ admin_gateway_port if inventory_hostname in groups['swarm_workers'] else kuma_port }}

firewall_swarm_common_rules:
  - protocol: tcp
    port: "7946"
    comment: Swarm node TCP
  - protocol: udp
    port: "7946"
    comment: Swarm node UDP
  - protocol: udp
    port: "4789"
    comment: Swarm overlay
  - protocol: esp
    comment: Swarm encrypted overlay
