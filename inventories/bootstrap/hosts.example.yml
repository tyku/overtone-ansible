---
# Copy this file to hosts.yml and replace every CHANGE_ME value locally.
# Bastion is deliberately absent: its administrative SSH access already works.
all:
  children:
    bootstrap_targets:
      children:
        haproxy_hosts:
          hosts:
            haproxy:
              ansible_host: CHANGE_ME_HAPROXY_PUBLIC_IP
              ansible_user: CHANGE_ME_PROVIDER_USER
              overtone_admin_user: overtone_haproxy

        swarm:
          children:
            swarm_managers:
              hosts:
                manager-1:
                  ansible_host: CHANGE_ME_MANAGER_1_PUBLIC_IP
                  ansible_user: CHANGE_ME_PROVIDER_USER
                  overtone_admin_user: overtone_manager-1

            swarm_workers:
              hosts:
                worker-1:
                  ansible_host: CHANGE_ME_WORKER_1_PUBLIC_IP
                  ansible_user: CHANGE_ME_PROVIDER_USER
                  overtone_admin_user: overtone_worker-1
                worker-2:
                  ansible_host: CHANGE_ME_WORKER_2_PUBLIC_IP
                  ansible_user: CHANGE_ME_PROVIDER_USER
                  overtone_admin_user: overtone_worker-2
