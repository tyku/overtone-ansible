---
# Copy this file to hosts.yml and replace every CHANGE_ME value locally.
# Bastion uses the SSH alias that is already configured on the Mac.
all:
  vars:
    # Keep the complete desired access model here. Both account playbooks and
    # 30-ssh-policy.yml use these lists to preserve AllowUsers correctly.
    team_access_users: []
    tunnel_access_users: []
    deploy_access_users: []

    # After initializing or verifying the production manager, record its
    # non-secret cluster identity here to prevent accidental foreign adoption.
    swarm_expected_id: ""

    # Example administrator:
    # team_access_users:
    #   - name: overtone_alice
    #     public_keys:
    #       - ssh-ed25519 CHANGE_ME_ALICE_PUBLIC_KEY alice@example
    #     hosts:
    #       - bastion
    #       - haproxy
    #       - manager-1
    #       - worker-1
    #       - worker-2
    #     state: present

    # Example GitHub Actions deploy identity. Store only the public key here.
    # The private key belongs in the protected production environment.
    # deploy_access_users:
    #   - name: overtone_deploy
    #     public_keys:
    #       - ssh-ed25519 CHANGE_ME_DEPLOY_PUBLIC_KEY github-actions
    #     target_host: manager-1
    #     state: present

    # Example tunnel identity. The same public key is installed on bastion
    # and both selected workers, with different key restrictions on each hop.
    # tunnel_access_users:
    #   - name: overtone_tunnel
    #     public_keys:
    #       - ssh-ed25519 CHANGE_ME_TUNNEL_PUBLIC_KEY tunnel
    #     target_hosts:
    #       - worker-1
    #       - worker-2
    #     permit_listen:
    #       - 127.0.0.1:50052
    #     state: present

  children:
    bastion_hosts:
      hosts:
        bastion:
          ssh_allowed_users:
            - CHANGE_ME_BASTION_USER
          firewall_admin_public_cidr: CHANGE_ME_ADMIN_PUBLIC_IP/32
          ansible_host: overtone-bastion
          private_ip: CHANGE_ME_BASTION_PRIVATE_IP

    internal:
      children:
        haproxy_hosts:
          hosts:
            haproxy:
              ansible_user: overtone_haproxy
              overtone_admin_user: overtone_haproxy
              ansible_host: CHANGE_ME_HAPROXY_PRIVATE_IP
              private_ip: CHANGE_ME_HAPROXY_PRIVATE_IP

        swarm:
          children:
            swarm_managers:
              hosts:
                manager-1:
                  ansible_user: overtone_manager-1
                  overtone_admin_user: overtone_manager-1
                  ansible_host: CHANGE_ME_MANAGER_1_PRIVATE_IP
                  private_ip: CHANGE_ME_MANAGER_1_PRIVATE_IP

            swarm_workers:
              hosts:
                worker-1:
                  ansible_user: overtone_worker-1
                  overtone_admin_user: overtone_worker-1
                  ansible_host: CHANGE_ME_WORKER_1_PRIVATE_IP
                  private_ip: CHANGE_ME_WORKER_1_PRIVATE_IP
                worker-2:
                  ansible_user: overtone_worker-2
                  overtone_admin_user: overtone_worker-2
                  ansible_host: CHANGE_ME_WORKER_2_PRIVATE_IP
                  private_ip: CHANGE_ME_WORKER_2_PRIVATE_IP
