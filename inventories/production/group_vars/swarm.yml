---
# Discover the exact value after configuring Docker's repository:
# apt-cache madison docker-ce
docker_ce_version: 5:29.6.2-1~ubuntu.26.04~resolute

# Membership in the docker group is effectively root-equivalent access.
docker_users:
  - "{{ overtone_admin_user }}"

# Optional immutable pull probe used by 45-docker-readiness.yml.
docker_pull_probe_enabled: false
docker_pull_probe_image: ""
