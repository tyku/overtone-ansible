---
ansible_become: true
ansible_ssh_private_key_file: >-
  {{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/overtone-infra/keys/overtone-production

common_packages:
  - acl
  - ca-certificates
  - curl
  - git
  - gnupg
  - htop
  - jq
  - rsync
  - unzip
  - vim

time_sync_service: systemd-timesyncd

public_interface: eth0
private_interface: eth1

unattended_upgrades_enabled: true
unattended_upgrades_automatic_reboot: false

# Bastion-only application administration.
kuma_port: 3001
admin_gateway_port: 8443

# Optional external-service connectivity checks in 91-infrastructure-readiness.yml.
postgresql_probe_enabled: false
postgresql_probe_host: ""
postgresql_probe_port: 5432
postgresql_tls_probe_enabled: false
s3_probe_enabled: false
s3_probe_url: ""
