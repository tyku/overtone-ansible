---
ansible_user: overtone
ansible_become: true
ansible_ssh_private_key_file: >-
  {{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/overtone-infra/keys/overtone-production

overtone_admin_user: overtone

common_packages:
  - acl
  - ca-certificates
  - curl
  - git
  - gnupg
  - htop
  - jq
  - rsync
  - unzip
  - vim

time_sync_service: systemd-timesyncd
